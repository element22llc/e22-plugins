# Version-pin EOL floor, enforced offline by check-version-pins.sh + scan-version-pins.sh.
# Rationale: /steer:reference conventions -> "Versioning policy" -> "Enforcement".
# minimum_supported = approved floor (may be stricter than upstream EOL); denied = explicit majors.
# Keep a deliberate old pin with `# steer:allow-pin <reason>` on its line, plus an ADR.

schema: 1

products:
  postgres:
    minimum_supported: "14"
    denied: ["9", "10", "11", "12", "13"]
  mysql:
    minimum_supported: "8"
    denied: ["5"]
  mariadb:
    minimum_supported: "10"
    denied: []
  mongo:
    minimum_supported: "7"
    denied: ["4", "5"]
  redis:
    minimum_supported: "7"
    denied: ["5", "6"]
  valkey:
    minimum_supported: "7"
    denied: []
  node:
    minimum_supported: "22"
    denied: ["16", "18", "20"]
  python:
    minimum_supported: "3.10"
    denied: ["3.7", "3.8", "3.9"]
  nginx:
    minimum_supported: "1.30"
    denied: []
