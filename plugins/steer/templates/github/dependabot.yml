# Dependabot config (installs to .github/dependabot.yml). Paired with ci.yml's dependabot-auto-merge job:
# patch/minor bumps merge once `ci` is green, unless protection requires a review (the `team`
# profile), where they wait for a human approval; majors stay with a human and are ignored for
# policy-governed ecosystems. `cooldown` holds a version update until the release is 7 days old, so a
# compromised publish is usually caught before auto-merge can land it; security updates are not delayed.
# Each ecosystem opens at most one grouped version PR and one grouped security PR per run: a group
# without `applies-to` covers version updates only. A security major stays its own PR.
# A github-actions bump also regenerates its entry in .github/workflows/actions.lock, in the same PR.
# Rationale: README.md#branch-protection.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

