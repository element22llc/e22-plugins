kind: Fixed
time: 2026-11-19T17:00:00.000000-05:00
custom:
  Slug: helper-root-probe
body: |
  - **Fixed: helper-based skills on Copilot CLI no longer skip their scripts.**
    The cross-tool `.agents/skills/` tree told the agent the installed plugin
    sets `STEER_PLUGIN_ROOT`, but Copilot CLI exports nothing to tool shells, so
    `/steer-setup worktrees`, `/steer-sync`, `/steer-next` and the rest reported
    "no local copy" with steer installed. Each such skill now carries a one-line
    probe that resolves the plugin directory - the variable, then
    `${COPILOT_HOME:-~/.copilot}/installed-plugins/*/steer`, then
    `plugins/steer` in a checkout - and says to pass the printed path on each
    helper command. Other hosts, Codex included, still set the variable by hand.
