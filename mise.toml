[tools]
python = "3.14"
uv = "0.11"
shellcheck = "latest"
shfmt = "latest"
actionlint = "latest"
# Local-only dev tools (node + the codegraph MCP code-intelligence server) are
# NOT listed here: they are not used by CI (Claude Code is installed via
# install.sh and Python via `uv sync`), and `codegraph@latest` cannot be pinned
# to a lockfile URL, which breaks `mise install --locked` on CI. Install them
# per-machine via a gitignored `mise.local.toml` — see AUTHORING.md.

[settings]
# Pin every tool resolution into mise.lock for reproducible installs.
lockfile = true

[env]
# Single source of truth for the Claude Code version the REQUIRED CI job installs,
# so `claude plugin validate` is reproducible and the authoritative result can't
# drift without a repo change. Bump deliberately after reviewing a new release.
# A separate, non-blocking CI job runs `latest` for an early compatibility signal.
STEER_CLAUDE_CODE_VERSION = "2.1.251"

# Pin the precompiled CPython flavor for every `mise install` in this env,
# mirroring the CI workflows (.github/workflows/plugin-quality.yml,
# docs-deploy.yml) which set it at job level. Without it, mise resolves
# python="latest" to the *free-threaded* 3.14 build, whose source-build /
# abi3-wheel path is slow and flaky (see PR #107). This matters most for the
# E2E suite: `/steer:init` runs `mise install` inside a throwaway scaffold repo
# (python="latest"), and this var is inherited by that subprocess — so local
# `mise run e2e` / `e2e:local` gets CI's fast, deterministic install instead of
# an intermittent multi-minute build that pushed the init scenario past the cap.
MISE_PYTHON_PRECOMPILED_FLAVOR = "install_only_stripped"

[tasks.lint]
description = "Lint and format-check Python code"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.typecheck]
description = "Type-check the verification scripts (ty, non-strict)"
# scripts/ IS the verification layer -- it is what stands between a bad rule and
# every managed repo in the org -- and until now nothing checked it structurally:
# ruff lints style, pytest exercises some paths, and a script that meets an
# unexpected shape crashes or fails confusingly at exactly the moment it is
# supposed to be the thing that catches something. `ty` (Astral, same toolchain
# as ruff/uv) runs over scripts/ only, at its default non-strict level.
run = ["uv run ty check scripts/"]

[tasks.actions-security]
description = "Static SECURITY analysis of GitHub Actions workflows (zizmor)"
# Complements `actions` (actionlint), which checks syntax and embedded shell --
# not template injection, credential persistence, cache poisoning or impostor
# commits. Two tiers, deliberately:
run = [
  # HARD gate on this repo's own workflows. Clean today, so this is a ratchet.
  "uv run zizmor --no-online-audits .github/workflows/",
  # ADVISORY on the SHIPPED workflow templates, which are copied into every
  # managed repo -- so one flaw there multiplies across the org, and that is
  # precisely why they get reported rather than ignored. They are NOT clean
  # today (unpinned action refs, missing `permissions:` blocks), and hardening
  # consumer-facing CI is a change that deserves its own review rather than
  # riding along with the linter that found it -- so this tier reports and never
  # fails, exactly like shfmt's grandfathered tier below. See issue #492.
  "uv run zizmor --no-online-audits plugins/steer/templates/github/workflows/*.yml || true",
]

[tasks.plugin-check]
description = "Run plugin hygiene + standards-consistency + release checks"
run = [
  "uv run python scripts/check_plugin.py",
  "uv run python scripts/check_standards.py",
  # Always-on context budgets (rules injection + skill-listing totals) and the
  # routing-vocabulary regression net — the PLAN.md Phase 0 ratchet gates.
  "uv run python scripts/check_context_budget.py",
  "uv run python scripts/check_routing_fixtures.py",
  # The committed Copilot instructions artifact (+ path-scoped instruction
  # files) must stay in sync with rules/.
  "uv run python scripts/check_copilot_instructions.py",
  # The committed cross-tool .agents/skills tree must stay in sync with skills/.
  "uv run python scripts/check_agent_skills.py",
  # The committed Copilot custom-agent artifacts must stay in sync with agents/.
  "uv run python scripts/check_copilot_agents.py",
  # The VS Code MCP scaffold must mirror the plugin's .mcp.json servers.
  "uv run python scripts/check_copilot_mcp.py",
  # The Copilot hook manifest must stay wired to real, shared hooks.json scripts.
  "uv run python scripts/check_copilot_hooks.py",
  # Every Copilot generator/gate must be wired into gen:copilot / plugin-check.
  "uv run python scripts/check_copilot_symmetry.py",
  # Release validator (no base ref → release-validator only; safe locally).
  "uv run python scripts/check_changelog.py",
  # Validate both the marketplace manifest (root) and the plugin manifest.
  # --strict promotes warnings (unrecognized fields, missing metadata) to
  # errors: the runtime tolerates them, but a manifest that only *almost*
  # validates is how a schema addition gets missed. Both manifests pass
  # strict today, so this is a ratchet, not a migration.
  "claude plugin validate . --strict",
  "claude plugin validate plugins/steer --strict",
]

[tasks.fixtures]
description = "Run golden fixture contract checks"
run = ["uv run python scripts/check_fixtures.py"]

[tasks.test]
description = "Run Python tests"
run = ["uv run pytest"]

[tasks.actions]
description = "Lint GitHub Actions workflows (this repo's own + the shipped scaffold template)"
run = [
  # Bare invocation scans this repo's .github/workflows/.
  "actionlint",
  # The shipped scaffold workflow lives outside .github/, so actionlint never
  # sees it by default — lint it explicitly (also shellchecks its run: blocks).
  "actionlint plugins/steer/templates/github/workflows/ci.yml",
  # The on-demand autonomous-loop workflow (instantiated by /steer:loop) also
  # ships outside .github/ — lint it explicitly for the same reason.
  "actionlint plugins/steer/templates/github/workflows/steer-loop.yml",
  # The Copilot coding-agent setup workflow ships outside .github/ too.
  "actionlint plugins/steer/templates/github/workflows/copilot-setup-steps.yml",
]

[tasks.shell]
description = "Lint and format-check every shell script (plugin hooks + libs + tests, plugin scripts, repo scripts, shipped scaffold)"
# The globs below must cover every `*.sh` the pre-commit `types: [shell]` hooks
# see, and shfmt must gate the same paths pre-commit gates — otherwise `check`
# stops being a superset of the commit gate and a green `check` can still be
# rejected by `git commit`. See [tasks.check].
run = [
  # ShellCheck is the hard gate everywhere (see .shellcheckrc for the few
  # intentional disables). Covers repo scripts and the shipped scaffold scripts
  # too — the latter are installed into consumer repos, so they must be clean.
  # `profiles/*/scripts/` carries the profile-specific scaffold scripts (the
  # workspace profile's ws.sh) — installed into consumer repos just like the
  # Layer-0 ones, so gated identically. `evals/*/scaffold.sh` are the routing
  # suite's per-case repo builders: not shipped, but pre-commit's `types: [shell]`
  # matches them, so `check` must too or it stops being a superset.
  "shellcheck plugins/steer/hooks/*.sh plugins/steer/hooks/lib/*.sh plugins/steer/hooks/tests/*.sh plugins/steer/scripts/*.sh plugins/steer/templates/scaffold/scripts/*.sh plugins/steer/templates/scaffold/profiles/*/scripts/*.sh plugins/steer/evals/*/scaffold.sh scripts/*.sh",
  # shfmt mirrors the pre-commit hook's scoping exactly: a HARD gate everywhere
  # except plugins/steer/hooks/.
  "shfmt -d plugins/steer/scripts/*.sh plugins/steer/templates/scaffold/scripts/*.sh plugins/steer/templates/scaffold/profiles/*/scripts/*.sh plugins/steer/evals/*/scaffold.sh scripts/*.sh",
  # plugins/steer/hooks/ predates the formatter and is grandfathered (pre-commit
  # excludes the same prefix): report drift, never fail. `shfmt -w` to apply.
  "shfmt -d plugins/steer/hooks/*.sh plugins/steer/hooks/lib/*.sh plugins/steer/hooks/tests/*.sh || true",
]

[tasks.hooktests]
description = "Run the POSIX-sh hook fixture suite (deterministic; no network)"
run = ["sh plugins/steer/hooks/tests/run.sh"]

[tasks.version-scan]
description = "Scan the repo for version pins that violate policy/versions.yml"
run = ["sh plugins/steer/scripts/scan-version-pins.sh ."]

[tasks."rules:preview"]
description = "Show the always-on ruleset a real session receives (which rules inject, which are scoped out, and the byte cost)"
# An authoring aid, not a gate — deliberately absent from `check` / `ci`.
# Runs the real inject-standards.sh + lib/scope.sh, so it cannot drift from what
# a session actually gets. `mise run rules:preview -- --knowledge` / `--repo
# <path>` / `--full`.
run = ["sh scripts/rules-preview.sh"]

[tasks."gen:copilot"]
description = "Regenerate the non-Claude surface artifacts: Copilot instructions + path-scoped instructions (from rules/), the cross-tool .agents/skills tree (from skills/), Copilot custom agents (from agents/), the VS Code MCP mirror (from .mcp.json), the hook manifest (from hooks.json), and the manifest versions (from plugin.json)"
run = [
  "uv run python scripts/gen_copilot_instructions.py --write",
  "uv run python scripts/gen_agent_skills.py --write",
  "uv run python scripts/gen_copilot_agents.py --write",
  "uv run python scripts/gen_copilot_mcp.py --write",
  "uv run python scripts/gen_copilot_hooks.py --write",
  "uv run python scripts/gen_copilot_manifests.py --write",
]

# Documentation site (Zensical + mermaid). The Zensical toolchain lives in
# the `docs` dependency-group so it is NOT installed by the default `uv sync`
# the CI env uses — serve/build pull it in on demand via `uv run --group docs`.
[tasks."docs:serve"]
description = "Serve the documentation site locally with live reload"
run = ["uv run --group docs zensical serve"]

[tasks."docs:build"]
description = "Build the documentation site (strict: fail on broken links/nav)"
run = ["uv run --group docs zensical build --strict"]

[tasks."docs:check"]
description = "Validate docs structure + sync with source of truth (no docs deps)"
run = ["uv run python scripts/validate_docs.py"]

[tasks.check]
description = "Run fast local checks (a superset of the pre-commit hygiene tier)"
# Must remain a strict superset of .pre-commit-config.yaml, so a green `check`
# is never followed by a rejected `git commit`. `shell` covers the shellcheck +
# shfmt hooks; `docs:check` covers the docs-sync hook (validate_docs.py, no docs
# deps needed). When you add a pre-commit hook, add its task here too.
depends = ["lint", "typecheck", "plugin-check", "actions", "actions-security", "shell", "docs:check"]

[tasks.delivery-gates]
description = "Run the PR-only branch-diff gates (changelog + docs impact) vs origin/main"
run = ["sh scripts/delivery-gates.sh"]

[tasks.ci]
description = "Run full CI-equivalent validation"
# `shell` and `docs:check` are not listed: `check` already depends on them
# (it mirrors the pre-commit tier), and mise resolves the task graph once.
depends = [
  "check",
  "fixtures",
  "test",
  "hooktests",
  "version-scan",
  "delivery-gates",
]

# Model-graded routing evals (`claude plugin eval`). Like the E2E suite below this
# spends real tokens (~$0.55 per case at runs: 1, both ablation arms), so it is
# deliberately NOT in `ci`'s depends and stays off the PR path — run it on the
# release path or when the routing surface changes.
#
# --scaffold is required: each case builds a managed repo from its own scaffold.sh,
# which is author-supplied bash the tool will not run unless asked.
#
# `claude plugin eval` is EARLY ACCESS, enabled per organization. On a machine the
# rollout has not reached it prints "currently in early access" and exits. For
# machines that cannot receive it (CI runners, gateways, telemetry-disabled
# clients) there is an enablement env var — obtain it from your Anthropic contact
# and set it in your shell or ~/.claude/settings.json `env`, not in this repo's
# .claude/settings.json (a committed value normally leaves the command gated off).
[tasks."evals"]
description = "Run the model-graded routing evals against the plugin (slow, costs tokens; needs plugin-eval early access)"
run = ["claude plugin eval plugins/steer --scaffold --ablation with-without"]

# Headless end-to-end skill suite — drives the real `claude` CLI against a
# throwaway repo and asserts on the files a skill produces. SLOW and spends
# tokens, so it is deliberately NOT in `ci`'s depends (stays off the PR path)
# and no longer runs in CI at all — it is a local-only tier now, run on demand
# via `mise run e2e` / `e2e:local`. Skips unless ANTHROPIC_API_KEY /
# CLAUDE_CODE_OAUTH_TOKEN is set (or STEER_E2E_LOCAL=1 for the seat variant).
[tasks."e2e"]
description = "Run the headless end-to-end skill suite (slow, costs tokens; needs ANTHROPIC_API_KEY)"
# -rP surfaces each scenario's captured turns/cost line even when the test passes
# (pytest otherwise swallows stdout on green).
run = ["uv run pytest -m e2e -rP"]

# Local variant: run the suite on your interactive `claude` login (subscription
# seat) instead of API tokens — run `claude /login` once first. `env -u
# ANTHROPIC_API_KEY` drops the key for this run so Claude Code bills the seat (it
# prefers the key when present); STEER_E2E_LOCAL=1 flips the skip-guard on. No
# --max-budget-usd is sent (no API dollar cost on a seat); the per-scenario
# wall-clock timeout still bounds a runaway.
#
# Run a single scenario (one ~3-min skill run instead of all) by forwarding -k:
#   mise run e2e:local -- -k init        # init scenarios only
#   mise run e2e:local -- -k adopt       # the adopt scenario
#   mise run e2e:local -- -k test_sync_is_noop_when_current
[tasks."e2e:local"]
description = "Run the E2E suite on your local Claude seat, no API charge (run `claude /login` first)"
run = ["env -u ANTHROPIC_API_KEY STEER_E2E_LOCAL=1 uv run pytest -m e2e -rP"]
