name: Back-port

# Carries what a merged release/* or hotfix/* PR shipped to prod back to main (and, for a
# hotfix, to an open release branch). Logic: scripts/backport.sh. Rationale:
# /steer:reference conventions -> "Deployment & environments".
#
# With GITHUB_TOKEN it pushes backport/* and comments a link for a human to open the PR:
# letting this token open PRs needs "Allow GitHub Actions to create and approve pull
# requests", which also lets any workflow approve one. To have it open the PR itself, mint a
# GitHub App token (actions/create-github-app-token) into GH_TOKEN and set
# BACKPORT_OPEN_PR: "true".

on:
  pull_request:
    types: [closed]
    branches: [prod]

permissions: {}

concurrency:
  group: backport-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  backport:
    name: backport
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
      startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # pushes the backport/* branch
      pull-requests: write # comments the link on the merged PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: changie
          cache: true

      - name: Back-port
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BACKPORT_OPEN_PR: "false"
        run: sh scripts/backport.sh
