kind: Fixed
time: 2026-11-26T13:00:00.000000000-05:00
custom:
  Slug: 938-include-aware-task-probes
body: |-
  - **Fixed: `/steer:setup sync` no longer reports `security-gate` and
    `promotion-gate` as mis-wired, or re-proposes the v7.21.0 workspace
    migration, when the mise tasks live outside `mise.toml`.** Both probes now
    use the same file-only task lookup as `drift-gate` and `question-gate`, and
    that lookup now reads every project config file mise does - `mise.toml`,
    `.mise.toml`, `mise/config.toml`, `.mise/config.toml`, `.config/mise.toml`
    and `.config/mise/config.toml` - for tasks and for `[task_config] includes`.
    A `mise.toml` that only names `ci:security` or `ci:promotion` (a `depends`
    entry, a comment) no longer counts as defining it. The v7.21.0 precondition
    finds `ws:pre-commit` defined in any committed TOML file or as a file task,
    and stays quiet under zsh. Still read-only: the scanner never runs mise.
