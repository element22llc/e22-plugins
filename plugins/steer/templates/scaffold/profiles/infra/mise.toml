# Root toolchain for an INFRASTRUCTURE repo (`infra` profile; replaces the core mise.toml,
# not the nested infra/mise.toml of an app repo). Rationale: /steer:reference conventions -> "Toolchain".

[settings]
lockfile = true
experimental = true

[env]
# Per-worktree Compose isolation; remove with compose.yaml if the repo runs no local services.
_.source = "scripts/worktree-env.sh"

[tools]
# Baseline — always installed. `node` is the agent-tooling runtime, not a Node project layer.
node = "latest"
python = "latest"
uv = "latest"
github-cli = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:rhysd/actionlint" = "latest"

# IaC engine: keep what matches this repo (/steer:init enables the detected one).
opentofu = "latest"
terragrunt = "latest"
"aqua:aws/aws-cli" = { version = "latest", symlink_bins = true }
# "pipx:ansible-core" = "latest"                                 # Ansible

[tasks."dev:setup"]
description = "One-command local setup: install IaC deps (provider/module init or Ansible roles)"
run = "terragrunt run --all init"

# Ansible: delete dev:setup's `run` and let this provider own role install (skipped while requirements.yml is unchanged).
# [deps.ansible-galaxy]
# auto = true
# depends = ["uv"]
# run = "uvx ansible-galaxy install -r requirements.yml && touch .galaxy-installed"
# sources = ["requirements.yml"]
# outputs = [".galaxy-installed"]

[tasks."docker:up"]
description = "Start local backing services (compose.yaml) and wait until healthy"
run = "docker compose up -d --wait"

[tasks."docker:down"]
description = "Stop this worktree's backing services (data volumes are kept)"
run = "docker compose down"

[tasks."docker:clean"]
description = "Tear down this worktree's services AND volumes (run before removing a worktree)"
run = "docker compose down --volumes --remove-orphans"

[tasks."infra:fmt"]
description = "Check IaC formatting (tofu fmt + terragrunt hclfmt)"
run = "tofu fmt -recursive -check -diff"

[tasks."infra:validate"]
description = "Validate IaC configuration across all units"
run = "terragrunt run --all validate"

[tasks."infra:plan"]
description = "Plan changes across all units (read-only; never auto-applies)"
run = "terragrunt run --all plan"

