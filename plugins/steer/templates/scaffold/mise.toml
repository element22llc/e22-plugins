# Toolchain pins + dev-loop tasks. Rationale: /steer:reference conventions ->
# "Toolchain", "Standard mise tasks". No mise.lock ships; /steer:init creates it.

[settings]
lockfile = true
experimental = true # gates the [deps] providers below

[deps.pnpm]
auto = true
[deps.uv]
auto = true

[tools]
# Agent-runtime baseline (npx/uvx tooling, convert:doc): never prune, even in a single-language repo.
node = "latest"
python = "latest"
uv = "latest"
github-cli = "latest"

# Stack-specific: keep what matches the product, delete the rest (IaC pins live in /infra/mise.toml).
"npm:pnpm" = "latest" # not the registry default aqua:pnpm/pnpm — it has no macOS asset
biome = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:rhysd/actionlint" = "latest"
# ruff = "latest"   # Python products
# go = "latest"
# rust = "latest"
# awscli = "latest"

[env]
# Per-worktree COMPOSE_PROJECT_NAME + host-port offset; non-secret project vars only.
_.source = "scripts/worktree-env.sh"

[tasks."dev:setup"]
description = "One-command local env: services up, schema migrated, data seeded (idempotent)"
depends = ["db:seed"]

[tasks."docker:up"]
description = "Start local backing services (compose.yaml) and wait until healthy"
run = "docker compose up -d --wait"

[tasks."docker:down"]
description = "Stop this worktree's backing services (data volumes are kept)"
run = "docker compose down"

[tasks."docker:clean"]
description = "Tear down this worktree's services AND volumes (run before removing a worktree)"
run = "docker compose down --volumes --remove-orphans"

[tasks."db:migrate"]
description = "Apply DB migrations in every workspace package that defines db:migrate"
depends = ["docker:up"]
run = "pnpm --recursive --if-present run db:migrate"

[tasks."db:seed"]
description = "Seed local dev data in every workspace package that defines db:seed"
depends = ["db:migrate"]
run = "pnpm --recursive --if-present run db:seed"

[tasks."convert:doc"]
description = "Convert an Office document (docx/pptx/xlsx/pdf) to Markdown on stdout — used by /steer:intake. Usage: mise run convert:doc <file>"
# `[all]` pulls the per-format extras; without it every format raises MissingDependency.
run = "uvx --from 'markitdown[all]' markitdown"

