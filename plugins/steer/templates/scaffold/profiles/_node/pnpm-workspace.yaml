# pnpm workspace globs + dependency catalog (referenced as "catalog:" in each package.json).
# /configs is consumed by relative path, not as a workspace package.
packages:
  - "apps/*"
  - "packages/*"

# esbuild (via tsx) needs its postinstall; unapproved, `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true

# `mise deps` has no TTY; without this pnpm aborts a node_modules purge (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
confirmModulesPurge: false

# Never set `minimumReleaseAge: 0`. A lockfile from an older/stray pnpm that trips the age check is
# regenerated under the pinned one: `mise exec --no-deps -- pnpm install --lockfile-only`.

catalog:
  typescript: ^6.0.3
  tsx: ^4.22.4
  # Keep the major matched to the runtime major (Dockerfile / CI node).
  "@types/node": ^24.0.0
