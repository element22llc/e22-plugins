kind: Changed
body: |-
  - **On an OpenSpec repo, steer's ADRs and tracker declaration now live under
    `openspec/steer/` instead of a thin `spec/` beside it.** The first release to
    support the OpenSpec backend parked them in `spec/decisions/` +
    `spec/tracker.md`, which left such a repo with two spine directories and no
    way to tell which was truth. They now sit in one place. The `steer/` segment
    is load-bearing rather than decorative: `openspec/` is written by a
    third-party CLI - `openspec update` regenerates `openspec/AGENTS.md`
    wholesale, and `openspec archive` relocates whole change directories - so a
    flat `openspec/decisions/` would be one upstream release away from a
    collision, while a namespaced subtree upstream will not claim is not.
    **Native repos are untouched:** `spec/` still resolves exactly as before, and
    the whole change is inert without an `openspec/` marker.

    The path is resolved in **one** place - `steer_tracker_file` /
    `steer_decisions_dir` in `hooks/lib/scope.sh` - which turned out to be the
    whole migration. Every issue-first hook
    (`check-write-nudges`, `check-bash-actions`, `reconcile-issue-first`) already
    reached the tracker through `steer_tracker_is_github` rather than by naming
    the path, so redirecting that one helper moved all of them; only
    `scan-capabilities.sh` and `workspace-snapshot.sh` needed touching. The
    resolvers **assign** rather than print, because they sit on the PreToolUse
    hot path where a command substitution would fork a subshell on every tool
    call. Skill bodies keep their native `spec/` prose and rule 33 states the
    override, the same pattern that already lets rule 33 override rule 30 -
    28 skills did not have to be edited to move two files.

    **`steer_spine_state` gained two outcomes rather than a second bypass.**
    `openspec` (steer's artifacts present) and `openspec-setup` (an `openspec/`
    spine with steer's side not laid down yet) are tested first, because after
    the move such a repo may have no `spec/` at all - which the old ladder read
    as `unmanaged`, i.e. the full greenfield bootstrap card pushing an init that
    would lay a second, competing spine. Making it a state instead of a
    special case in front of one caller is what keeps `/steer:doctor`,
    `/steer:sync` and `/steer:audit` answering the same question the same way.
    The `damaged` carve-out added with the interim shape is gone: it existed
    because that `spec/` was still load-bearing, and it no longer is.

    Repos already on the interim shape are carried across by a `MIGRATIONS.md`
    entry (`git mv` both artifacts, then a bounded in-file token rewrite), and
    until it runs the session is told so explicitly rather than silently reading
    a different `tracker.md` from the one being edited.
