# pnpm 11 settings (build-script approval + overrides moved here from package.json).
# playwright-chromium's postinstall downloads the headless browser used by the
# optional `mise run export` (PDF/PNG); approve it so `slidev export` can run.
allowBuilds:
  playwright-chromium: true

# Pin the whole Vue family to one exact version (3.5.40, published 2026-07-16 —
# well clear of pnpm 11's minimum-release-age supply-chain cooldown). `overrides`
# forces the transitive @vue/* deps (slidev pulls several) to that same version,
# not just our direct dep, so installs stay deterministic and policy-clean.
# When bumping, pick a release already past the cooldown rather than adding a
# `minimumReleaseAgeExclude` entry — the exclude throws the protection away.
overrides:
  vue: 3.5.40
  '@vue/compiler-core': 3.5.40
  '@vue/compiler-dom': 3.5.40
  '@vue/compiler-sfc': 3.5.40
  '@vue/compiler-ssr': 3.5.40
  '@vue/reactivity': 3.5.40
  '@vue/runtime-core': 3.5.40
  '@vue/runtime-dom': 3.5.40
  '@vue/server-renderer': 3.5.40
  '@vue/shared': 3.5.40
