name: Publish release (tag + GitHub Release)

# Turns a merged release into a first-class GitHub Release. Fires post-merge on
# `main` when the plugin manifest changed, and only acts when the release commit
# actually bumped the plugin version. The `/release` (and `/quick-release`)
# skills open the release PR; this workflow finishes the job automatically once
# that PR lands, so there is no manual `gh release create` step to remember.
#
# Idempotent and self-checking: a version whose Release already exists is
# skipped, a tag that already exists but points elsewhere fails loudly instead
# of being silently reused, and every publish ends by asserting that the tag
# resolves to the commit that introduced the version. A manual dispatch may
# re-publish an OLDER version; it is tagged on the commit that set plugin.json
# to that version (never on today's `main`), and is not marked "Latest".
on:
  push:
    branches: [main]
    paths:
      - plugins/steer/.claude-plugin/plugin.json
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish, e.g. 3.11.0. Defaults to plugin.json's current version."
        required: false
        default: ""

# Creating the tag + Release needs write access to repo contents. Nothing here
# touches pull requests, packages, or pages.
permissions:
  contents: write

# Two pushes to main in quick succession must not race each other to the same
# tag. Never cancel: a cancelled publish is the one failure mode the /release
# skill's Step 1 anchor check cannot distinguish from "not fired yet".
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the release gate diffs HEAD~1, and a manual dispatch
          # locates the commit that introduced an older version.
          fetch-depth: 0
          # The release is cut through `gh` with an explicit GH_TOKEN, and nothing
          # here pushes with git -- so no credential needs to survive the checkout.
          persist-credentials: false

      - name: Release gate (only publish on a plugin.json version bump; manual always runs)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          manifest="plugins/steer/.claude-plugin/plugin.json"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual dispatch -> publishing"
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare the PARSED version fields, not a grep over changed lines: a
          # reflowed description containing the word "version" must not fire this.
          before=$(git show HEAD~1:"$manifest" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || echo "")
          after=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest")
          if [ "$before" != "$after" ]; then
            echo "plugin.json version ${before:-<none>} -> ${after} -> release -> publishing"
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "plugin.json touched but version unchanged (${after}) -> nothing to publish"
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi

      # Version source of truth is plugin.json; a manual dispatch may override it
      # to re-publish an older release. Notes come from the matching CHANGELOG
      # section -- a bump with no `### X.Y.Z` heading is a release-integrity bug,
      # so fail loudly rather than cut an empty Release. Pure-stdlib script runs
      # on the runner's system python3 (no mise/uv provisioning needed).
      - name: Resolve version, target commit and notes
        if: steps.gate.outputs.run == 'true'
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          manifest="plugins/steer/.claude-plugin/plugin.json"
          current=$(python3 scripts/changelog_release_notes.py current-version)
          version="${INPUT_VERSION:-$current}"
          case "$version" in
            *[!0-9.]*|"") echo "::error::not a semver version: '${version}'"; exit 1 ;;
          esac
          if [ "$version" = "$current" ]; then
            target="$HEAD_SHA"
            latest="true"
          else
            # Re-publishing an older version: tag the FIRST commit on main whose
            # plugin.json carries that version, and do not steal the Latest badge.
            target=$(git log --first-parent --format=%H -S"\"version\": \"${version}\"" -- "$manifest" | tail -1)
            if [ -z "$target" ]; then
              echo "::error::no commit on main sets ${manifest} to ${version}"; exit 1
            fi
            at_target=$(git show "${target}:${manifest}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
            if [ "$at_target" != "$version" ]; then
              echo "::error::commit ${target} carries version ${at_target}, not ${version}"; exit 1
            fi
            latest="false"
          fi
          echo "Publishing steer ${version} at ${target} (latest=${latest})"
          python3 scripts/changelog_release_notes.py notes "$version" >release-notes.md
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "target=${target}"
            echo "latest=${latest}"
          } >>"$GITHUB_OUTPUT"

      - name: Create tag + GitHub Release
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ steps.meta.outputs.target }}
          LATEST: ${{ steps.meta.outputs.latest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists -> skipping (idempotent)"
            exit 0
          fi
          # A tag without a Release is a half-finished publish (or a manual tag).
          # Reuse it only if it points where this release would point; otherwise
          # refuse -- a Release on the wrong commit is worse than no Release.
          existing=$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)
          if [ -n "$existing" ]; then
            resolved=$(git rev-list -n 1 "$existing" 2>/dev/null || echo "$existing")
            if [ "$resolved" != "$TARGET" ]; then
              echo "::error::tag ${TAG} already exists at ${resolved}, expected ${TARGET}"; exit 1
            fi
            echo "tag ${TAG} already exists at the expected commit; creating the Release on it"
          fi
          # Body = curated CHANGELOG bullets; --generate-notes appends GitHub's
          # "What's Changed" (merged-PR list, new contributors, and the
          # vPrev...vX.Y.Z compare link) beneath them -- the API pre-pends the
          # --notes-file body to the generated section. --target creates the tag
          # on that commit if it does not yet exist.
          gh release create "$TAG" \
            --title "steer ${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            --latest="$LATEST" \
            --target "$TARGET"
          echo "Published ${TAG}"

      - name: Verify the published tag
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          # The Release must exist and its tag must resolve to the intended commit;
          # `/release` Phase A anchors the next audit's diff on this tag, so a tag
          # on the wrong commit silently mis-scopes every later audit.
          gh release view "$TAG" --json tagName,targetCommitish,isDraft --jq . >/dev/null
          git fetch --quiet origin "refs/tags/${TAG}:refs/tags/${TAG}"
          resolved=$(git rev-list -n 1 "$TAG")
          if [ "$resolved" != "$TARGET" ]; then
            echo "::error::${TAG} resolves to ${resolved}, expected ${TARGET}"; exit 1
          fi
          echo "${TAG} -> ${resolved} verified"
