kind: Changed
body: |-
    - **Changed: the bundled GitHub MCP server exposes only issue tools.** The
      plugin's `.mcp.json` now sends `X-MCP-Toolsets: context,issues`, which
      cuts the server from 49 tools to 14: every issue tool steer calls, plus
      `get_me`. Fewer tool definitions keep tool selection sharp. Steer itself
      loses nothing, since pull requests, repositories and workflow runs already
      go through `gh`, but a session whose only GitHub MCP server is steer's no
      longer has MCP tools for them; add your own server in a project or user
      `.mcp.json` to get them back. The scaffold's `.vscode/mcp.json` carries
      the same header. `/steer:setup sync` never rewrites `.vscode/`, so an
      existing repo keeps the full toolset in VS Code until it merges the
      header by hand.
