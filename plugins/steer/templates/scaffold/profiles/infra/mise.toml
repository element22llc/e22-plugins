# Root toolchain for an INFRASTRUCTURE repo (`infra` profile; replaces the core mise.toml,
# not the nested infra/mise.toml of an app repo). Rationale: /steer:reference conventions -> "Toolchain".
# steer:allow-comments most of the comment lines here are opt-in IaC stanzas the repo uncomments for its engine

min_version = "2026.4.18" # first release with the [deps] table

[settings]
lockfile = true
experimental = true

[env]
# Per-worktree Compose isolation; remove with compose.yaml if the repo runs no local services.
_.source = "scripts/worktree-env.sh"

[tools]
# Baseline - always installed. `node` is the agent-tooling runtime, not a Node project layer.
node = "latest"
python = "latest"
uv = "latest"
github-cli = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:rhysd/actionlint" = "latest"
# Pinned, unlike the rest: a silent upgrade would change released output.
changie = "1.26.0"

# IaC engine: keep what matches this repo (/steer:setup init enables the detected one).
opentofu = "latest"
terragrunt = "latest"
"aqua:aws/aws-cli" = { version = "latest", symlink_bins = true }
# "pipx:ansible-core" = "latest"                                 # Ansible

[tasks."dev:setup"]
description = "One-command local setup: install IaC deps (provider/module init or Ansible roles)"
run = "terragrunt run --all init"

# Ansible: delete dev:setup's `run` and let this provider own role install (skipped while requirements.yml is unchanged).
# [deps.ansible-galaxy]
# auto = true
# depends = ["uv"]
# run = "uvx ansible-galaxy install -r requirements.yml && touch .galaxy-installed"
# sources = ["requirements.yml"]
# outputs = [".galaxy-installed"]

[tasks."docker:up"]
description = "Start local backing services (compose.yaml) and wait until healthy"
run = "docker compose up -d --wait"
timeout = "5m"

[tasks."docker:down"]
description = "Stop this worktree's backing services (data volumes are kept)"
run = "docker compose down"

[tasks."docker:clean"]
description = "Tear down this worktree's services AND volumes (run before removing a worktree)"
run = "docker compose down --volumes --remove-orphans"

[tasks."changelog:new"]
description = "Record a changelog fragment (--kind Fixed --slug short-name --body='- **Fixed: ...**', or KIND/SLUG/BODY env)"
usage = '''
flag "--kind <kind>" env="KIND" help="A kind from changie.yaml: Added, Changed, Fixed, Security, Docs"
flag "--slug <slug>" env="SLUG" help="3-6 kebab-case words"
flag "--body <body>" env="BODY" help="The entry text"
'''
run = "node scripts/changelog-new.mjs"

[tasks."changelog:merge"]
description = "Reassemble CHANGELOG.md from .changes/ (run after a release cut)"
run = "changie merge"

[tasks."infra:fmt"]
description = "Check IaC formatting (tofu fmt + terragrunt hclfmt)"
run = "tofu fmt -recursive -check -diff"

[tasks."infra:validate"]
description = "Validate IaC configuration across all units"
run = "terragrunt run --all validate"

[tasks."infra:plan"]
description = "Plan changes across all units (read-only; never auto-applies)"
run = "terragrunt run --all plan"

# The `ci:*` stages are the core scaffold's, verbatim: `.github/workflows/ci.yml` runs
# each by name, and each script no-ops for a stack it does not detect.
[tasks."ci:hygiene"]
description = "Stack-agnostic hygiene: mise task graph, actionlint, shellcheck, version-pin policy"
run = "sh scripts/ci-hygiene.sh"

[tasks."ci:deps"]
description = "Install workspace dependencies (Node) for the checks that need them"
run = "sh scripts/ci-deps.sh"
# Skipped while these are unchanged since its last success - typecheck, test and coverage each pull it in.
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "apps/*/package.json", "packages/*/package.json"]

[tasks."ci:lint"]
description = "Lint + format check every detected stack (Biome / Ruff)"
run = "sh scripts/ci-lint.sh"

[tasks."ci:typecheck"]
description = "Static type check (Node/TS)"
depends = ["ci:deps"]
run = "sh scripts/ci-typecheck.sh"

[tasks."ci:test"]
description = "Run the test suite for every detected stack (a detected stack with no tests FAILS)"
depends = ["ci:deps"]
run = "sh scripts/ci-test.sh"

[tasks."ci:iac"]
description = "IaC checks: OpenTofu/Terraform fmt, Ansible lint"
run = "sh scripts/ci-iac.sh"

[tasks."ci:image"]
description = "Build-only container image check (no push, no credentials)"
run = "sh scripts/ci-image.sh"

[tasks."ci:changelog"]
description = "A change that ships must bring a changelog fragment (any push or PR; fail-open)"
run = "sh scripts/ci-changelog.sh"

[tasks."ci:spec"]
description = "Open-question contract: no bare checkboxes, stale seeds, or blocking questions past their gate"
run = "sh scripts/ci-spec.sh"

[tasks."ci:coverage"]
description = "Changed-line coverage gate (diff-cover) - needs ci:test's reports"
depends = ["ci:test"]
run = "sh scripts/ci-coverage.sh"

[tasks.pre-commit]
description = "Sub-second commit gate: hygiene + lint. Wired to .git/hooks/pre-commit by /steer:setup init."
# Install per clone: `mise generate git-pre-commit --task=pre-commit --write`.
depends = ["ci:hygiene", "ci:lint"]

[tasks.check]
description = "Fast gate: hygiene + lint + typecheck. Run before every commit."
depends = ["ci:hygiene", "ci:lint", "ci:typecheck"]

[tasks.ci]
description = "Full gate: everything the required `ci` status check runs. Run before push / PR."
depends = ["check", "ci:test", "ci:iac", "ci:image", "ci:coverage", "ci:changelog", "ci:spec"]

