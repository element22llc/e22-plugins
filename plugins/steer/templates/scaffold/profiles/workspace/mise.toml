# Workspace (polyrepo spine host) mise.toml — REPLACES the core one. Every task is
# `ws:`-prefixed: this file is an ancestor config in every member, so an unprefixed
# name would shadow a member's. Rationale: /steer:reference polyrepo -> "Every workspace task is ws:-prefixed".

# Monorepo mode — uncomment once a member is cloned. `monorepo_root` is a TOP-LEVEL key:
# it must stay ABOVE [settings]; uncomment in place. Leave `[monorepo].lockfile` unset.
# monorepo_root = true

# [monorepo]
# config_roots = [
#   "frontend",
#   "backend",
# ]

[settings]
lockfile = true
experimental = true

[tools]
# Agent-runtime baseline — never prune; /steer:intake converts PO documents here, at the spine host.
node = "latest"
python = "latest"
uv = "latest"
github-cli = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:rhysd/actionlint" = "latest"
# No pnpm/biome/ruff: linters belong to the member that owns the code.

[env]
# Own Compose identity (<repo>[-<worktree>]) so this stack and a member's standalone stack stay separate; host ports still collide.
_.source = "scripts/worktree-env.sh"

[tasks."ws:clone"]
description = "Clone every member repo that declares a `path:` in spec/workspace.yml (idempotent)"
run = "sh scripts/ws.sh clone"

[tasks."ws:sync"]
description = "Fast-forward each cloned member to its manifest branch (never rewrites; skips dirty/diverged)"
run = "sh scripts/ws.sh sync"

[tasks."ws:status"]
description = "Per-member branch/dirty/spine-version report + manifest-vs-compose/.gitignore drift"
run = "sh scripts/ws.sh status"

[tasks."ws:code"]
description = "Generate the VS Code multi-root workspace (<product>.code-workspace) from spec/workspace.yml"
run = "sh scripts/ws.sh code"

[tasks."ws:list"]
description = "List the members declared in spec/workspace.yml"
run = "sh scripts/ws.sh list"

[tasks."ws:docker:up"]
description = "Start every member's backing services (compose.yaml include:) and wait until healthy"
# preflight tells an unresolved `include:` list apart from an absent member checkout; bare compose fails identically for both.
run = [
  "sh scripts/ws.sh preflight",
  "docker compose up -d --wait",
]

[tasks."ws:docker:down"]
description = "Stop this workspace's services (data volumes are kept)"
run = "docker compose down"

[tasks."ws:docker:clean"]
description = "Tear down this workspace's services AND volumes"
run = "docker compose down --volumes --remove-orphans"

[tasks."ws:dev"]
description = "Boot the product's backing services; add per-member depends (monorepo mode) for the dev servers"
# `depends` resolves in the CALLER's task set, so use `ws:` names here (a bare `docker:up` binds to a member's). Dev servers: add "//<member>:dev" entries.
depends = ["ws:docker:up"]

[tasks."convert:doc"]
description = "Convert an Office document (docx/pptx/xlsx/pdf) to Markdown on stdout — used by /steer:intake"
# The one unprefixed task: its `run` must stay identical to the core scaffold's (check_standards.py asserts it).
run = "uvx --from 'markitdown[all]' markitdown"
