kind: Fixed
body: |-
    - **Fixed: `/steer:work qa` runs in solo-trunk, and the new debug and
      adoption prose agrees with the rest of steer.** `qa` drives the unpushed
      trunk commits in solo-trunk instead of refusing on the default branch. A
      symptom-only `debug` is listed with the modes that skip the tracker
      preconditions, writes no regression test, and is triggered by an issue
      of kind `bug` rather than a `bug` label steer never applies. The intent
      template and `/steer:spec approve` name adoption's `as-built` sign-off
      as the one write outside approve mode.
