time: 2026-11-17T09:34:00.000000000-05:00
custom:
  Slug: skill-listing-budget
body: |-
  - **Fixed: the skill listing fits a 200K-window session again.** The 29
    `description` + `when_to_use` entries had regrown to 8,220 characters,
    103% of the 8,000 a 200K-context model gets, so Claude Code could drop
    whole descriptions, least-invoked skill first, before any other plugin's
    skills were counted. The listing is back to 7,679 (96%). The cuts are
    restatement, not triggers: `work`, `next`, `status`, `audit`, `standards`
    and `setup` no longer say the same thing in both fields or enumerate what
    the skill body carries, and every quoted user phrasing and guardrail
    phrase is kept. No description holds a `<placeholder>` or `->` any more -
    Claude Code shows them to the model as `&lt;`, `&gt;`, and
    `argument-hint` already carries the placeholders (#961).
