name: Dependabot auto-merge

# The documented exception to the human-review gate: auto-approves and merges Dependabot
# patch/minor bumps once every check is green; majors stay with a human. Needs the repo
# setting "Allow GitHub Actions to create and approve pull requests" (/steer:setup protect).
# Rationale: README.md#branch-protection -> "Dependabot - and the auto-merge exception".

on: pull_request

# Dependabot-triggered runs get exactly the permissions declared here.
# `gh pr checks` resolves the GraphQL `statusCheckRollup`, which reads check runs
# (`checks`) and commit statuses (`statuses`) - without both it fails, not degrades.
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  dependabot-auto-merge:
    name: dependabot-auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `github.actor` is the LAST actor to touch the context, not the one that opened the
    # PR - an attacker can land a HEAD commit that makes it read `dependabot[bot]` while the
    # rest of the branch is theirs. `pull_request.user.login` is the PR's author and cannot be
    # moved that way. (This workflow is `on: pull_request`, never `pull_request_target`.)
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for every check, approve, merge (patch/minor)
        if: >-
          ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
              steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Through `env:`, not interpolated into the script: a `${{ }}` expansion inside a
          # `run:` block is substituted before the shell sees it, so a value carrying shell
          # metacharacters would execute rather than print.
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          # Checks that must report `pass`; skipped counts as a failure. Add e2e/integration here.
          GATING_CHECKS: ci
        run: |
          head_now() { gh pr view "$PR_URL" --json headRefOid --jq .headRefOid; }
          # Every check but this job must finish: `--required` alone let a bump merge while a
          # non-required e2e job was still running, and `gh pr checks` reads skipped as green.
          while :; do
            checks="$(gh pr checks "$PR_URL" --json name,bucket \
              --jq '.[] | select(.name != "dependabot-auto-merge") | "\(.bucket) \(.name)"')" || true
            if printf '%s\n' "$checks" | grep -E '^(fail|cancel) '; then
              echo "::error::A check failed or was cancelled - not merging."
              exit 1
            fi
            waiting=0
            printf '%s\n' "$checks" | grep -q '^pending ' && waiting=1
            for gate in $GATING_CHECKS; do
              if printf '%s\n' "$checks" | grep -qFx "skipping $gate"; then
                echo "::error::Gating check '$gate' was skipped - not merging."
                exit 1
              fi
              printf '%s\n' "$checks" | grep -qFx "pass $gate" || waiting=1
            done
            [ "$waiting" -eq 1 ] || break
            sleep 30
          done
          if [ "$(head_now)" != "$HEAD_SHA" ]; then
            echo "::notice::The PR head moved; the run for the new head merges it."
            exit 0
          fi
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved by steer: ${UPDATE_TYPE} dependency update. CI is the hard gate (see .github/workflows/dependabot-auto-merge.yml)." || {
            echo "::error::Approval refused. Enable Settings -> Actions -> General -> \"Allow GitHub Actions to create and approve pull requests\" (/steer:setup protect checks it)."
            exit 1
          }
          # Direct merge, no repo-wide allow_auto_merge; pinned to the verified head.
          if ! gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"; then
            # Strict protection refuses an out-of-date branch: update it for a later run. Never on
            # a moved head - a foreign commit makes Dependabot stop rebasing its own PR.
            if [ "$(head_now)" = "$HEAD_SHA" ]; then
              gh pr update-branch "$PR_URL"
            else
              echo "::notice::The PR head moved; the run for the new head merges it."
            fi
          fi

      - name: Note major update left for human review
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" \
            --body "Major version update - **not** auto-merged. steer leaves majors for a human: they can carry breaking changes and may need a \`policy/versions.yml\` decision (\`/steer:spec adr\` if you raise a floor)."
