custom:
  Slug: learnings-routing-coherence
body: |
  - **Fixed: learnings routing now agrees across rules and references.** Rule
    `30-spec` and `CONVENTIONS.md` sent a lesson to `/spec/learnings/` as soon
    as no test, lint or contract could carry it, skipping the product
    `CLAUDE.md` rung of the enforcement ladder that `/steer:work finish` and
    `TRACEABILITY.md` apply; both now name that rung. Rule
    `33-spec-workflow-openspec` no longer sends a stray `spec/learnings/` on an
    OpenSpec repo to `/steer:setup sync`, which never moves it - it says to
    `git mv` the note under `openspec/steer/`.
