# Copilot coding-agent environment. The job MUST be named `copilot-setup-steps` - Copilot
# discovers it by that exact name. Standards come from .github/copilot-instructions.md;
# MCP servers and firewall live in Settings -> Copilot -> Coding agent, not here.
name: Copilot setup steps

on:
  workflow_dispatch:
  # Also runs on push/PR so a broken setup is caught before an issue is assigned.
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - mise.toml
      - mise.lock
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - mise.toml
      - mise.lock

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job: nothing pushes, so the token need not persist in .git/config.
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      # Idempotent, a no-op with no services yet; drop for a library/cli profile.
      - name: Set up local dev environment
        run: mise run dev:setup
