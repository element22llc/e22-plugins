# `@claude` mention workflow. Loads the steer plugin so CI Claude runs under the same ruleset
# as a local session. Prerequisite: the ANTHROPIC_API_KEY secret (README.md#github-actions-secrets).
# Load steer ONLY via the action's plugin inputs — settings.json enabledPlugins is trust-dialog gated, no-ops in CI.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # The marketplace repo is public: anonymous clone, no credential needed.
          plugin_marketplaces: |
            https://github.com/element22llc/e22-plugins.git
          plugins: |
            steer@e22-plugins
          # Optional inputs (trigger_phrase, assignee_trigger, claude_args, settings):
          # see the anthropics/claude-code-action README.
