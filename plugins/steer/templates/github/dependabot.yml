# Dependabot config (installs to .github/dependabot.yml). Paired with dependabot-auto-merge.yml:
# patch/minor bumps auto-merge once `ci` is green; majors stay with a human and are ignored for
# policy-governed ecosystems. Rationale: README.md#branch-protection.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One grouped PR per week instead of one per action.
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

