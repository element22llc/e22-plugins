name: Merge-back

# After a release/* or hotfix/* PR merges into prod, pushes a merge-back/* branch at prod's tip for
# main (and, for a hotfix, an open release branch). Logic: scripts/merge-back.sh. Rationale:
# /steer:reference conventions -> "Deployment & environments".
#
# With GITHUB_TOKEN it pushes merge-back/* and comments a link for a human to open the PR:
# letting this token open PRs needs "Allow GitHub Actions to create and approve pull
# requests", which also lets any workflow approve one. To have it open the PR itself, mint a
# GitHub App token (actions/create-github-app-token) into GH_TOKEN and set
# MERGE_BACK_OPEN_PR: "true".

on:
  pull_request:
    types: [closed]
    branches: [prod]

permissions: {}

concurrency:
  group: merge-back-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge-back:
    name: merge-back
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
      startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # pushes the merge-back/* branch
      pull-requests: write # comments the link on the merged PR
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge-back
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_BACK_OPEN_PR: "false"
        run: sh scripts/merge-back.sh
