# Changelog assembly. Rationale: /steer:reference conventions -> "Changelog".
# CHANGELOG.md is generated -- never edit it by hand.
# steer:allow-comments what remains is the opt-in replacements stanza plus two traps recorded nowhere else
changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md

versionFormat: "## {{.VersionNoPrefix}}"

# The body carries its own bullet and `**Kind: ...**` lead-in; `kind` drives the
# version bump and the grouping order and is not rendered.
kindFormat: ""
changeFormat: "{{.Body}}"

newlines:
  afterVersion: 1
  beforeChangelogVersion: 1
  endOfVersion: 1

# Slug is required: without it `changie new` stamps filenames only to the second,
# so two changes recorded in the same second silently overwrite each other.
fragmentFileFormat: "{{.Kind | lower}}-{{.Time.Format \"20060102-1504\"}}-{{.Custom.Slug}}"

custom:
  - key: Slug
    type: string
    label: Slug (3-6 kebab-case words naming the change)
    minLength: 3

kinds:
  - label: Added
    auto: minor
  - label: Changed
    auto: minor
  - label: Fixed
    auto: patch
  - label: Security
    auto: patch
  - label: Docs
    auto: patch

# Opt-in: publish the version string into a manifest.
# replacements:
#   - path: package.json
#     find: '^  "version": ".*",$'
#     replace: '  "version": "{{.VersionNoPrefix}}",'
