kind: Fixed
time: 2026-11-17T13:30:00.000000000-05:00
custom:
  Slug: merge-gate-large-commands
body: |-
  - **Fixed: the merge gate no longer times out on a large Bash command.**
    `check-bash-actions.sh` parsed the command one character at a time, and
    macOS awk copies the whole string on each step, so a 400 KB command took
    10 to 30 s against the hook's 10 s timeout - and a timed-out PreToolUse
    hook lets the command run, `gh pr merge` included. The parser is now
    linear (about 1 s for 400 KB) and runs once per call instead of once per
    check. Past 512 KiB the gates match the raw command with its quotes opened
    instead of parsing it, so quoted prose counts there too - failing closed.
    A latency test denies five large command shapes inside half the timeout
    (#966).
