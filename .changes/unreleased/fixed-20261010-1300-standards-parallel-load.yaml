kind: Fixed
body: |-
  - **Fixed: `/steer:standards` loads the rules in one batch, not one file per
    turn.** It read each `rules/*.md` file in a turn of its own, so the load
    took 23 turns in the 2026-10-09 evals, past the 12-turn cap of a typical
    session. It now lists the directory once and reads every rule file, plus
    `plugin.json` for the version line, in a single parallel batch.
time: 2026-10-10T13:00:00.000000000-04:00
custom:
  Slug: standards-parallel-load
