kind: Fixed
body: |-
    - **Fixed: a high-risk ADR drafted during a bootstrap gets the stress-test
      round too.** `/steer:spec adr` skipped the high-risk question round
      whenever `/steer:setup` or `/steer:build` called it, on the premise that
      the bootstrap interview had already asked - it never does. An adoption's
      "replace custom auth" ADR now gets the round; with no dev in the session
      (a `/steer:build` PO), the four questions are recorded as open in the
      ADR's Context for the dev's review. `REVIEW-LOOP.md` also now counts the
      four inputs each gate's reviewer receives.
time: 2026-11-03T19:00:00.000000-05:00
