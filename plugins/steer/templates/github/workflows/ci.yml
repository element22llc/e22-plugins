name: CI

on:
  pull_request:
    # `prod` too: branch-protection makes `ci` a required check on the main -> prod promotion PR.
    branches: [main, prod]
    # `ready_for_review` is what starts CI on a PR opened as a draft. The other three are
    # the defaults, restated because naming `types` at all replaces them.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Supersede a PR's own in-flight run when it is pushed again — the biggest saver of
# Actions minutes on an agent-driven branch, which pushes often. Never on `main`:
# every trunk commit gets its own conclusive run.
# Least privilege for every job: all four only read the tree and write annotations /
# the step summary, neither of which needs a token scope. A job that later needs more
# (a PR comment, a SARIF upload) declares it on that job, never here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The single required status check: stack-agnostic hygiene always, then the checks for each
# DETECTED stack. A detected stack with no test contract FAILS — green must mean tests ran.
#
# Every step delegates to a `mise run ci:*` task (mise.toml -> "Verification tasks"), whose
# logic lives in scripts/ci-*.sh. CI and the local gate therefore run the SAME code: reproduce
# any failure here with `mise run ci`, and validate a change with no CI run at all.
# Rationale: README.md#branch-protection; /steer:reference conventions -> Testing / Coverage.

jobs:
  ci:
    name: ci
    # Draft PRs skip every job, so work in progress costs no minutes. SAFE against branch
    # protection: a *skipped* job satisfies a required status check (GitHub requires
    # "successful, skipped, or neutral"), and a draft PR cannot be merged regardless.
    # Do NOT reach for `paths-ignore` to save more — a workflow that never fires leaves the
    # required check ABSENT, which is not the same as skipped and blocks the PR forever.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the coverage step diffs changed lines against the base branch.
          fetch-depth: 0
          # Nothing here pushes; leaving the token in .git/config would carry it into
          # any artifact or nested action that reads the checkout.
          persist-credentials: false

      # mise-action adds `--locked` whenever mise.lock exists; before /steer:init|adopt commits
      # one, this is a plain unlocked install rather than a failure.
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      # Every check below is a `mise run` task defined in mise.toml, so the SAME command
      # validates on a laptop: `mise run check` (fast) / `mise run ci` (everything here).
      # The logic lives in scripts/ci-*.sh — shellcheck-gated, and never duplicated between
      # this file and the local gate. Rationale: mise.toml -> "Verification tasks".
      # Secret scanning is GitHub-native (Settings -> Code security), not a CI step.

      - name: Hygiene (actionlint, shellcheck, version-pin policy)
        run: mise run ci:hygiene

      - name: Lint + format check (Biome / Ruff)
        run: mise run ci:lint

      - name: Type check (Node/TS)
        run: mise run ci:typecheck

      # A detected stack with no test contract FAILS — green must mean tests ran.
      - name: Test
        run: mise run ci:test

      - name: IaC checks (OpenTofu/Terraform fmt, Ansible lint)
        run: mise run ci:iac

      - name: Build container image(s)
        run: mise run ci:image

      # Same workflow context as coverage; locally the script falls back to origin/main.
      - name: Changelog fragment (shipping changes only)
        env:
          STEER_CI_EVENT: ${{ github.event_name }}
          STEER_CI_BASE_REF: ${{ github.base_ref }}
          STEER_CI_BEFORE: ${{ github.event.before }}
        run: mise run ci:changelog

      # The workflow context the gate needs; locally the script falls back to origin/main.
      - name: Coverage (changed-line gate)
        env:
          STEER_CI_EVENT: ${{ github.event_name }}
          STEER_CI_BASE_REF: ${{ github.base_ref }}
          STEER_CI_BEFORE: ${{ github.event.before }}
        run: mise run ci:coverage

      # Opt-in: a build step (add a `build` script per app; the root script fans out with --if-present).
      # - name: Build
      #   run: pnpm run build

  # Advisory — remove `continue-on-error` to make it block.
  design-lint:
    name: design.md lint (advisory)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed DESIGN.md files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_SHA:-HEAD~1}"
          files=$(git diff --name-only "$base" HEAD -- '**/DESIGN.md' 'DESIGN.md' || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Lint changed DESIGN.md files
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Linting $f"
            npx --yes @google/design.md@0.3.0 lint "$f"
          done <<< "$CHANGED_FILES"

  # Rule 55's machine surface, advisory; on push it is solo-trunk's only enforcer.
  # To block: drop `continue-on-error`, turn ::warning:: into ::error:: + exit 1.
  spec-drift:
    name: spec-drift (advisory)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect undocumented behavior change
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}...HEAD"
          elif [ "${BEFORE:-$ZERO}" = "$ZERO" ]; then
            echo "::notice::No prior commit to diff against (first push) - skipping spec-drift (fail-open)."
            exit 0
          else
            range="${BEFORE}..${HEAD_SHA}"
          fi
          changed=$(git diff --name-only "$range" || true)
          [ -n "$changed" ] || exit 0
          behavior=$(printf '%s\n' "$changed" \
            | grep -E '^(apps|packages|src|services|lib|app)/' \
            | grep -Ev '(^|/)(tests?|__tests__|e2e|fixtures)/|\.(test|spec)\.[A-Za-z0-9]+$' \
            || true)
          # Date-prefixed entries only (not the dir's README). The legacy single-file path lives ONLY in the
          # regex — naming it in prose breaks the migration ledger's grep of this file.
          spec=$(printf '%s\n' "$changed" \
            | grep -E '^spec/features/.+/(contract|intent)\.md$|^spec/history/[0-9][^/]*\.md$|^spec/HISTORY\.md$' \
            || true)
          if [ -n "$behavior" ] && [ -z "$spec" ]; then
            {
              echo "## Spec drift (advisory)"
              echo
              echo "Behavior changed but no \`spec/features/<id>/contract.md\`, \`intent.md\`,"
              echo "or a \`spec/history/\` entry was written in this change. Update the spec in the"
              echo "same change, or confirm via the PR template's **Spec sync** checkbox that"
              echo "there is no behavior change."
              echo
              echo "Behavior paths flagged:"
              printf '%s\n' "$behavior" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$behavior" | while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "::warning file=${f}::Behavior changed without a spec/contract/history update (spec-drift, advisory)"
            done
          fi

  # Advisory; .aislop/config.yml turns down rules that duplicate ruff/Biome. Make it blocking by dropping
  # `continue-on-error` and the `|| true` below — `scan` already exits 1 on findings or score < ci.failBelow.
  # Findings land as PR annotations + a step summary, which cost nothing; code scanning is a paid feature on
  # private repos. On a repo with GitHub Code Security, `--sarif` + `github/codeql-action/upload-sarif` works too.
  ai-slop:
    name: ai-slop (advisory)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Scan for AI slop
        # Exit 1 means findings or score < ci.failBelow — that is the report, not a failure. A crashed
        # scan exits 1 too but writes no report, which is what the jq probe separates.
        run: |
          npx --yes aislop@0.14.0 scan . --json > aislop.json || true
          jq -e .schemaVersion aislop.json > /dev/null

      - name: Report findings
        run: |
          jq -r '
            def cell: gsub("\\|"; "\\|") | gsub("\n"; " ");
            def count(f): (f // 0);
            "## ai-slop (advisory)",
            "",
            (if .scoreable then "**Score \(.score) - \(.label)**" else "**Not scored**" end)
              + " · \(count(.summary.errors)) error(s)"
              + " · \(count(.summary.warnings)) warning(s)"
              + " · \(count(.summary.fixable)) fixable"
              + " · \(count(.summary.files)) file(s) scanned",
            "",
            (if (.diagnostics | length) == 0 then "No findings."
             else
               (["| Severity | Rule | Location | Message |", "| --- | --- | --- | --- |"]
                + ([.diagnostics[]
                    | "| \(.severity) | `\(.rule)` | `\(.filePath):\(.line)` | \(.message | cell) |"][:200])
                + (if (.diagnostics | length) > 200
                   then ["", "_First 200 of \(.diagnostics | length) findings. Run `npx aislop scan .` locally for the rest._"]
                   else [] end))[]
             end)
          ' aislop.json >> "$GITHUB_STEP_SUMMARY"
          # Workflow commands need their own escaping, and GitHub renders at most 10 annotations
          # per level per step — the step summary above is the complete list.
          jq -r '
            def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def prop: esc | gsub(","; "%2C") | gsub(":"; "%3A");
            def pos: if (. // 0) < 1 then 1 else . end;
            # An advisory job must not mark the diff red, so every severity drops one level and the
            # reported one moves into the title. Two levels also keep 20 annotation slots, not 10.
            def level: if .severity == "error" then "warning" else "notice" end;
            # One annotation per rule before any rule gets a second slot, so a single noisy rule
            # cannot spend the whole budget on itself.
            def spread: (group_by(.rule) | map(.[0])) as $first | $first + (. - $first);
            ["warning", "notice"][] as $level
            | [.diagnostics[] | select(level == $level)] | spread | .[:10][]
            | "::\($level) file=\(.filePath | prop),line=\(.line | pos),col=\(.column | pos),title=\(.severity | prop) · \(.rule | prop)::\(.message | esc)"
          ' aislop.json
