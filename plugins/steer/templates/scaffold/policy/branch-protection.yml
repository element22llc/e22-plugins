# Branch-protection policy /steer:setup protect diffs against live GitHub settings and applies.
# Fields map 1:1 to the classic protection API; rationale: /steer:reference conventions.
# steer:allow-comments each note names why a protection setting is what it is -- deleting them loses the security rationale, not noise

schema: 5          # additive - v1 (no `protected_branches`), v2 (no profiles), v3 (no
                   # `actions_can_approve_pull_requests`) and v4 (no `allow_auto_merge`) stay valid.

# `team` applies everything below as written; `solo` layers `profiles.solo` on top.
# GitHub blocks a PR's author from approving it, so on a one-contributor repo the
# 1-approval rule below would leave the sole dev unable to merge at all.
profile: team

branch: default

required_pull_request_reviews:
  required_approving_review_count: 1
  dismiss_stale_reviews: true

# `strict: false` on purpose: requiring up-to-date branches serializes delivery for little gain.
required_status_checks:
  strict: false
  contexts:
    - ci

enforce_admins: true

required_linear_history: true

# Overrides layered onto EVERY branch in scope. `team` has none.
profiles:
  solo:
    required_approving_review_count: 0

# Optional. `prod` is the branch-based production gate (environment approvals are
# Enterprise-only); a branch not yet created is reported, never forced.
protected_branches:
  - name: prod
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
    required_status_checks:
      strict: false
      contexts:
        - ci
    enforce_admins: true
    required_linear_history: true

# Repo-level settings, applied via separate settings APIs by /steer:setup protect.
secret_scanning: true
secret_scanning_push_protection: true

dependabot_alerts: true
dependabot_security_updates: true

# Review-gate exception: Dependabot patch/minor bumps auto-merge via
# .github/workflows/dependabot-auto-merge.yml (majors stay human-reviewed). The workflow arms
# GitHub's native auto-merge, so `required_status_checks` above - not a billed runner polling
# them - is what makes a bump wait for green: every check that must gate it belongs in `contexts`.
# Native auto-merge needs repo-wide `allow_auto_merge`, which offers the button on every PR; it
# still merges only once that PR satisfies this protection, reviews included.
allow_auto_merge: true
# The workflow approves with GITHUB_TOKEN, which needs "Allow GitHub Actions to create and
# approve pull requests". That lets ANY workflow approve ANY PR, so a writer could
# self-approve through a workflow on their own branch. Checked only while the workflow is
# installed; `false` on either setting declines the exception, and then the workflow should
# be deleted.
actions_can_approve_pull_requests: true
