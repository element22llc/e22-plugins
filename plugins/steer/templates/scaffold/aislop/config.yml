# aislop config for the advisory `ai-slop` CI job: keep the `ai-slop/*` rules on, turn off
# what the `ci` job already gates. Delete this file to run every rule at its default.

rules:
  # Covered by ruff/bandit (Python) and Biome (Node).
  security/python-exec: "off"
  complexity/function-too-long: "off"
  complexity/deep-nesting: "off"
  code-quality/duplicate-block: "off"
  # Covered by Dependabot / `pnpm audit`.
  security/vulnerable-dependency: "off"

# `scan` already exits 1 on any error-severity finding or a score below `ci.failBelow` (default 70) —
# the CI job is advisory only because it tolerates that exit. Tune the threshold here; make the gate
# blocking in .github/workflows/ci.yml (drop `continue-on-error` and the scan step's `|| true`).
# ci:
#   failBelow: 70
