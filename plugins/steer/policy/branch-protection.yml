# Branch-protection policy — the real PR gate lives on GitHub; /steer:protect diffs this
# against live settings and applies it. Fields map 1:1 to the classic protection API.
# Rationale: /steer:reference conventions -> "Deployment & environments".

schema: 2          # v1 files (no `protected_branches`) remain valid — it is additive.

branch: default

required_pull_request_reviews:
  required_approving_review_count: 1
  dismiss_stale_reviews: true

# `strict: false` on purpose: requiring up-to-date branches serializes delivery for little gain.
required_status_checks:
  strict: false
  contexts:
    - ci

enforce_admins: true

required_linear_history: true

# Optional. `prod` is the branch-based production gate (environment approvals are
# Enterprise-only); a branch not yet created is reported, never forced.
protected_branches:
  - name: prod
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
    required_status_checks:
      strict: false
      contexts:
        - ci
    enforce_admins: true
    required_linear_history: true

# Repo-level settings, applied via separate settings APIs by /steer:protect.
secret_scanning: true
secret_scanning_push_protection: true

dependabot_alerts: true
dependabot_security_updates: true

# Review-gate exception: Dependabot patch/minor bumps auto-merge via
# .github/workflows/dependabot-auto-merge.yml once `ci` is green (majors stay human-reviewed).
# Repo-wide `allow_auto_merge` stays OFF — it would expose the button to every PR.
