name: Dependabot auto-merge

# The documented exception to the human-review gate: auto-approves Dependabot patch/minor
# bumps and arms GitHub's native auto-merge, so branch protection's required checks decide
# the merge and no billed runner waits on them; majors stay with a human. Needs the repo
# settings "Allow auto-merge" and "Allow GitHub Actions to create and approve pull requests"
# (/steer:setup protect).
# Rationale: README.md#branch-protection -> "Dependabot - and the auto-merge exception".

on: pull_request

# Dependabot-triggered runs get exactly the permissions declared here.
# `gh pr checks` resolves the GraphQL `statusCheckRollup`, which reads check runs
# (`checks`) and commit statuses (`statuses`) - without both it fails, not degrades.
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  dependabot-auto-merge:
    name: dependabot-auto-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # `github.actor` is the LAST actor to touch the context, not the one that opened the
    # PR - an attacker can land a HEAD commit that makes it read `dependabot[bot]` while the
    # rest of the branch is theirs. `pull_request.user.login` is the PR's author and cannot be
    # moved that way. (This workflow is `on: pull_request`, never `pull_request_target`.)
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and arm native auto-merge (patch/minor)
        if: >-
          ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
              steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Through `env:`, not interpolated into the script: a `${{ }}` expansion inside a
          # `run:` block is substituted before the shell sees it, so a value carrying shell
          # metacharacters would execute rather than print.
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          # Checks branch protection must require - they, not this job, gate the merge. Add
          # e2e/integration here and to policy/branch-protection.yml's `contexts`.
          GATING_CHECKS: ci
        run: |
          head_now() { gh pr view "$PR_URL" --json headRefOid --jq .headRefOid; }
          # On a branch that requires nothing, `--auto` merges at once with no check run. A
          # sibling workflow's checks can register a few seconds after this run starts.
          for attempt in 1 2 3 4 5 6; do
            required="$(gh pr checks "$PR_URL" --required --json name --jq '.[].name')" || true
            missing=""
            for gate in $GATING_CHECKS; do
              printf '%s\n' "$required" | grep -qFx "$gate" || missing="$missing $gate"
            done
            [ -n "$missing" ] && [ "$attempt" -lt 6 ] || break
            sleep 10
          done
          if [ -n "$missing" ]; then
            echo "::error::Not a required check:$missing - auto-merge would not wait for it. Require it on the default branch (policy/branch-protection.yml, /steer:setup protect) - not merging."
            exit 1
          fi
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved by steer: ${UPDATE_TYPE} dependency update. Branch protection's required checks gate the merge (see .github/workflows/dependabot-auto-merge.yml)." || {
            echo "::error::Approval refused. Enable Settings -> Actions -> General -> \"Allow GitHub Actions to create and approve pull requests\" (/steer:setup protect checks it)."
            exit 1
          }
          if ! gh pr merge --auto --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"; then
            if [ "$(head_now)" != "$HEAD_SHA" ]; then
              echo "::notice::The PR head moved; the run for the new head arms the merge."
              exit 0
            fi
            echo "::error::Auto-merge refused. Enable Settings -> General -> \"Allow auto-merge\" (/steer:setup protect checks it)."
            exit 1
          fi

      - name: Note major update left for human review
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" \
            --body "Major version update - **not** auto-merged. steer leaves majors for a human: they can carry breaking changes and may need a \`policy/versions.yml\` decision (\`/steer:spec adr\` if you raise a floor)."
