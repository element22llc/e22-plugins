# Toolchain pins + dev-loop tasks. Rationale: /steer:reference conventions ->
# "Toolchain", "Standard mise tasks". No mise.lock ships; /steer:init creates it.

[settings]
lockfile = true
experimental = true # gates the [deps] providers below

[deps.pnpm]
auto = true
[deps.uv]
auto = true

[tools]
# Agent-runtime baseline (npx/uvx tooling, convert:doc): never prune, even in a single-language repo.
node = "latest"
python = "latest"
uv = "latest"
github-cli = "latest"

# Stack-specific: keep what matches the product, delete the rest (IaC pins live in /infra/mise.toml).
"npm:pnpm" = "latest" # not the registry default aqua:pnpm/pnpm — it has no macOS asset
biome = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:rhysd/actionlint" = "latest"
# ruff = "latest"   # Python products
# go = "latest"
# rust = "latest"
# awscli = "latest"

[env]
# Per-worktree COMPOSE_PROJECT_NAME + host-port offset; non-secret project vars only.
_.source = "scripts/worktree-env.sh"

[tasks."dev:setup"]
description = "One-command local env: services up, schema migrated, data seeded (idempotent)"
depends = ["db:seed"]

[tasks."docker:up"]
description = "Start local backing services (compose.yaml) and wait until healthy"
run = "docker compose up -d --wait"

[tasks."docker:down"]
description = "Stop this worktree's backing services (data volumes are kept)"
run = "docker compose down"

[tasks."docker:clean"]
description = "Tear down this worktree's services AND volumes (run before removing a worktree)"
run = "docker compose down --volumes --remove-orphans"

[tasks."db:migrate"]
description = "Apply DB migrations in every workspace package that defines db:migrate"
depends = ["docker:up"]
run = "pnpm --recursive --if-present run db:migrate"

[tasks."db:seed"]
description = "Seed local dev data in every workspace package that defines db:seed"
depends = ["db:migrate"]
run = "pnpm --recursive --if-present run db:seed"

# ---------------------------------------------------------------------------
# Verification tasks. `.github/workflows/ci.yml` runs these same tasks, so the
# checks cannot drift between your laptop and CI — and a repo whose org is out
# of Actions minutes still has the full gate locally.
#
# Two tiers: `check` is the fast pre-push/pre-commit gate (no containers, no
# coverage); `ci` is everything the required `ci` status check runs.
#
# Every leaf task DETECTS its stack and no-ops with a notice when absent, so
# pruning this file to your product's stack never leaves a `depends` pointing at
# a task that no longer exists.
# ---------------------------------------------------------------------------

[tasks."ci:hygiene"]
description = "Stack-agnostic hygiene: actionlint, shellcheck, version-pin policy"
run = "sh scripts/ci-hygiene.sh"

[tasks."ci:deps"]
description = "Install workspace dependencies (Node) for the checks that need them"
run = "sh scripts/ci-deps.sh"

[tasks."ci:lint"]
description = "Lint + format check every detected stack (Biome / Ruff)"
run = "sh scripts/ci-lint.sh"

[tasks."ci:typecheck"]
description = "Static type check (Node/TS)"
depends = ["ci:deps"]
run = "sh scripts/ci-typecheck.sh"

[tasks."ci:test"]
description = "Run the test suite for every detected stack (a detected stack with no tests FAILS)"
depends = ["ci:deps"]
run = "sh scripts/ci-test.sh"

[tasks."ci:iac"]
description = "IaC checks: OpenTofu/Terraform fmt, Ansible lint"
run = "sh scripts/ci-iac.sh"

[tasks."ci:image"]
description = "Build-only container image check (no push, no credentials)"
run = "sh scripts/ci-image.sh"

[tasks."ci:coverage"]
description = "Changed-line coverage gate (diff-cover) — needs ci:test's reports"
depends = ["ci:test"]
run = "sh scripts/ci-coverage.sh"

[tasks.pre-commit]
description = "Sub-second commit gate: hygiene + lint. Wired to .git/hooks/pre-commit by /steer:init."
# The tier that must stay FAST — it runs on every commit. Deliberately no
# typecheck (needs an installed workspace) and no tests: those are `check` and
# `ci`. Its job is to stop a lint/format failure before it costs a CI run, not
# to be a second `ci`.
#
# Install per clone: `mise generate git-pre-commit --task=pre-commit --write`.
# .git/hooks/ is not versioned, so every clone runs it once — but linked
# worktrees share the primary checkout's hooks, so `claude --worktree` needs
# nothing extra. `git commit --no-verify` bypasses it; CI does not.
depends = ["ci:hygiene", "ci:lint"]

[tasks.check]
description = "Fast gate: hygiene + lint + typecheck. Run before every commit."
depends = ["ci:hygiene", "ci:lint", "ci:typecheck"]

[tasks.ci]
description = "Full gate: everything the required `ci` status check runs. Run before push / PR."
depends = ["check", "ci:test", "ci:iac", "ci:image", "ci:coverage"]

[tasks."convert:doc"]
description = "Convert an Office document (docx/pptx/xlsx/pdf) to Markdown on stdout — used by /steer:intake. Usage: mise run convert:doc <file>"
# `[all]` pulls the per-format extras; without it every format raises MissingDependency.
run = "uvx --from 'markitdown[all]' markitdown"

