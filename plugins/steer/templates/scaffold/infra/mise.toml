# Tool pins for /infra only — keeps the root mise.toml stack-agnostic (see ./README.md).
# Rationale: /steer:reference conventions -> "Toolchain". No infra/mise.lock ships: create
# it here (`touch mise.lock && mise install && mise lock --platform linux-x64,macos-arm64`)
# and commit it. Bump with `mise upgrade`; validate in non-prod before prod.

[settings]
lockfile = true

[tools]
opentofu = "latest"
terragrunt = "latest"
"aqua:aws/aws-cli" = { version = "latest", symlink_bins = true }
