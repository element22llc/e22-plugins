kind: Fixed
time: 2026-11-06T15:00:00.000000000-05:00
custom:
  Slug: hotfix-lane-targets-prod
body: |-
  - **Fixed: a `/steer:work --hotfix` no longer ships unreleased work to
    production.** The lane named a `hotfix/<n>-slug` branch but not its base, so
    a fix cut from `main` carried every unreleased commit through the `prod`
    gate. Under `production_gate: prod-branch-pr` the branch is now cut from
    `prod` and its PR targets `prod`, carrying its own patch cut (`changie batch
    patch`), and the mandatory follow-up opens a `prod -> main` back-port PR.
    `/steer:work promote` stops while a hotfix version on `prod` is missing from
    `main`. The scaffold `ci:changelog` gate skips a back-port PR (head `prod`),
    whose fragment the hotfix cut already consumed; `/steer:setup sync`
    carries the gate change into an installed `ci.yml` and `ci-changelog.sh`.
