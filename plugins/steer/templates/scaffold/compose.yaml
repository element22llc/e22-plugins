# Local backing services — committed so local matches deployed. Rationale:
# /steer:reference conventions -> "Local services". No container_name or fixed
# host port here: scripts/worktree-env.sh isolates parallel worktrees via env.

services:
  postgres:
    image: postgres:18 # major-only tag; confirm current stable major on adoption
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql # postgres:18+ mounts the parent dir, not …/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
