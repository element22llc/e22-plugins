name: CI

on:
  pull_request:
    # `prod` too: branch-protection makes `ci` a required check on the main -> prod promotion PR.
    branches: [main, prod]
  push:
    branches: [main]

# The single required status check: stack-agnostic hygiene always, then the checks for each
# DETECTED stack. A detected stack with no test contract FAILS — green must mean tests ran.
# Rationale: README.md#branch-protection; /steer:reference conventions -> Testing / Coverage.

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the coverage step diffs changed lines against the base branch.
          fetch-depth: 0

      # mise-action adds `--locked` whenever mise.lock exists; before /steer:init|adopt commits
      # one, this is a plain unlocked install rather than a failure.
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # Stack-agnostic hygiene — always runs.

      - name: Lint GitHub Actions workflows (actionlint)
        run: actionlint -color

      - name: Lint shell scripts (shellcheck)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint."
          else
            printf '%s\n' "${scripts[@]}"
            shellcheck "${scripts[@]}"
          fi

      # Committed-state backstop for the interactive version-pin hook (policy/versions.yml floors).
      - name: Version-pin policy scan
        run: sh scripts/scan-version-pins.sh .

      # Secret scanning is GitHub-native (Settings -> Code security), not a CI step.

      - name: Detect stack
        id: detect
        run: |
          node=false
          python=false
          tf=false
          ansible=false
          pulumi=false
          if [ -f package.json ] || [ -f pnpm-workspace.yaml ]; then node=true; fi
          if [ -f pyproject.toml ] || git ls-files '*/pyproject.toml' | grep -q .; then python=true; fi
          # Keep in lockstep with steer_repo_does_iac (plugin hooks/lib/scope.sh); a bare roles/ dir is NOT Ansible.
          if git ls-files '*.tf' '*.hcl' | grep -q .; then tf=true; fi
          if [ -f ansible.cfg ] || [ -f site.yml ] || [ -f site.yaml ] || { [ -d roles ] && [ -d playbooks ]; }; then ansible=true; fi
          if [ -f Pulumi.yaml ] || [ -f Pulumi.yml ]; then pulumi=true; fi
          {
            echo "node=$node"
            echo "python=$python"
            echo "tf=$tf"
            echo "ansible=$ansible"
            echo "pulumi=$pulumi"
          } >> "$GITHUB_OUTPUT"
          if [ "$node" = false ] && [ "$python" = false ] && [ "$tf" = false ] && [ "$ansible" = false ] && [ "$pulumi" = false ]; then
            echo "::notice::No application or infra stack detected (no package.json / pyproject.toml / *.tf / Ansible / Pulumi layout). Stack-agnostic hygiene ran; stack validation is not yet active."
          fi

      - name: Install dependencies (Node)
        if: steps.detect.outputs.node == 'true'
        # Freeze only once a lockfile exists (a fresh fork has none until /steer:init generates it).
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "No pnpm-lock.yaml yet — installing without frozen lockfile."
            pnpm install --no-frozen-lockfile
          fi

      - name: Lint + format check (Biome — Node/TS)
        if: steps.detect.outputs.node == 'true'
        run: biome ci .

      - name: Type check (Node/TS)
        if: steps.detect.outputs.node == 'true'
        run: pnpm run typecheck

      - name: Test (Node/TS)
        if: steps.detect.outputs.node == 'true'
        # The root `--if-present` fan-out is not a test contract — green must mean tests ran.
        run: |
          if ! git ls-files '*package.json' \
               | xargs grep -hE '"test"[[:space:]]*:' 2>/dev/null \
               | grep -qv -- '--if-present'; then
            echo "::error::Node workspace detected but no package defines a \"test\" script — a green CI would not mean tests ran. Add tests (Definition of Done)."
            exit 1
          fi
          # Per-package lcov.info only when @vitest/coverage is wired; the gate below is fail-open without it.
          if git ls-files '*package.json' | xargs grep -lq '@vitest/coverage' 2>/dev/null; then
            pnpm run test -- --coverage --coverage.reporter=lcov
          else
            pnpm run test
          fi

      - name: Lint + format check (Ruff — Python)
        if: steps.detect.outputs.python == 'true'
        run: |
          ruff check .
          ruff format --check .

      - name: Test (Python)
        if: steps.detect.outputs.python == 'true'
        # pytest exit 5 = no tests collected: fail rather than report a false green.
        run: |
          cov_args=""
          if uv run python -c "import pytest_cov" >/dev/null 2>&1; then
            cov_args="--cov --cov-report=xml --cov-report=term-missing"
          fi
          rc=0
          # shellcheck disable=SC2086
          uv run pytest $cov_args || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::error::Python project detected but pytest collected no tests. Add tests (Definition of Done)."
            exit 1
          fi
          exit "$rc"

      - name: Format check (OpenTofu/Terraform)
        if: steps.detect.outputs.tf == 'true'
        # `tofu` is on PATH only when the ROOT toolchain pins it (app-profile repos keep IaC under infra/): skip, don't fail.
        run: |
          if ! command -v tofu >/dev/null 2>&1; then
            echo "::notice::*.tf/*.hcl present but 'tofu' is not on PATH at the repo root (an app-profile repo pins IaC tools under infra/, not root). Skipping the root format check."
            exit 0
          fi
          tofu fmt -check -recursive -diff

      - name: Lint Ansible (ansible-lint)
        if: steps.detect.outputs.ansible == 'true'
        # Pin uvx tools: unpinned takes today's PyPI latest, and Dependabot cannot see versions inside run: blocks.
        run: |
          if ls .yamllint .yamllint.yml .yamllint.yaml >/dev/null 2>&1; then
            uvx yamllint@1.38.0 .
          fi
          uvx ansible-lint@26.6.0

      # Build-only (no push, no creds); a notice-and-skip until a Dockerfile exists (see templates/docker/).
      - name: Build container image(s)
        run: |
          # Build context is the repo root so workspace deps + the lockfile are in scope.
          mapfile -t dockerfiles < <(git ls-files 'apps/*/Dockerfile' 'Dockerfile')
          if [ ${#dockerfiles[@]} -eq 0 ]; then
            echo "::notice::No Dockerfile found (apps/*/Dockerfile or ./Dockerfile) — skipping image build. Add one when a deployable app exists (see the plugin's templates/docker/)."
            exit 0
          fi
          for df in "${dockerfiles[@]}"; do
            # APP=<app> makes CI authoritative over the Dockerfile's ARG default.
            build_args=()
            case "$df" in
              apps/*/Dockerfile) build_args+=(--build-arg "APP=$(basename "$(dirname "$df")")") ;;
            esac
            echo "::group::docker build -f $df ${build_args[*]} ."
            docker build -f "$df" "${build_args[@]}" .
            echo "::endgroup::"
          done

      # Gates only the lines a change touches — never a global %; fail-open without a report.
      # Rationale: rule 41-coverage; /steer:reference conventions -> Coverage.
      - name: Coverage (changed-line gate)
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'push') &&
          (steps.detect.outputs.node == 'true' || steps.detect.outputs.python == 'true')
        env:
          COVERAGE_DIFF_MIN: "80"
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          # The root fan-out writes PER-PACKAGE reports, so glob apps/* and packages/* alongside the root paths.
          reports=()
          for f in coverage/lcov.info apps/*/coverage/lcov.info packages/*/coverage/lcov.info \
                   coverage.xml apps/*/coverage.xml packages/*/coverage.xml; do
            if [ -f "$f" ]; then reports+=("$f"); fi
          done
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::notice::No coverage report produced — wire pytest-cov / @vitest/coverage to measure coverage (run /steer:reference conventions -> Coverage). Skipping changed-line gate."
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/${BASE_REF}"
            if ! git fetch --no-tags --quiet origin "$BASE_REF" 2>/dev/null; then
              echo "::notice::Could not fetch base branch '$BASE_REF' — skipping changed-line coverage (fail-open)."
              exit 0
            fi
          else
            # push to main: the solo-trunk DoD floor (pr-flow already gated via PR).
            if ! grep -Eiq '^[[:space:]]*<!--[[:space:]]*steer:delivery-mode=solo-trunk[[:space:]]*-->' CLAUDE.md 2>/dev/null; then
              echo "::notice::push to main in pr-flow — the PR already gated coverage; skipping push-time floor."
              exit 0
            fi
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$ZERO" ]; then
              echo "::notice::No prior commit to diff against (first push) — skipping changed-line coverage (fail-open)."
              exit 0
            fi
            base="$BEFORE"
          fi
          echo "## Coverage (changed lines vs $base)" >> "$GITHUB_STEP_SUMMARY"
          # Pinned — this gate can FAIL a PR. If a bump drops --markdown-report, use --format markdown:coverage-diff.md.
          uvx diff-cover@10.4.1 "${reports[@]}" \
            --compare-branch "$base" \
            --fail-under "$COVERAGE_DIFF_MIN" \
            --markdown-report coverage-diff.md \
          || { cat coverage-diff.md >> "$GITHUB_STEP_SUMMARY"; \
               echo "::error::Changed lines are under ${COVERAGE_DIFF_MIN}% covered — cover the code you touched (rule 41-coverage)."; \
               exit 1; }
          cat coverage-diff.md >> "$GITHUB_STEP_SUMMARY"

      # Opt-in: a build step (add a `build` script per app; the root script fans out with --if-present).
      # - name: Build
      #   if: steps.detect.outputs.node == 'true'
      #   run: pnpm run build

  # Advisory — remove `continue-on-error` to make it block.
  design-lint:
    name: design.md lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed DESIGN.md files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_SHA:-HEAD~1}"
          files=$(git diff --name-only "$base" HEAD -- '**/DESIGN.md' 'DESIGN.md' || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Lint changed DESIGN.md files
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Linting $f"
            npx --yes @google/design.md@0.3.0 lint "$f"
          done <<< "$CHANGED_FILES"

  # Rule 55's machine surface, advisory; on push it is solo-trunk's only enforcer.
  # To block: drop `continue-on-error`, turn ::warning:: into ::error:: + exit 1.
  spec-drift:
    name: spec-drift (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect undocumented behavior change
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}...HEAD"
          elif [ "${BEFORE:-$ZERO}" = "$ZERO" ]; then
            echo "::notice::No prior commit to diff against (first push) — skipping spec-drift (fail-open)."
            exit 0
          else
            range="${BEFORE}..${HEAD_SHA}"
          fi
          changed=$(git diff --name-only "$range" || true)
          [ -n "$changed" ] || exit 0
          behavior=$(printf '%s\n' "$changed" \
            | grep -E '^(apps|packages|src|services|lib|app)/' \
            | grep -Ev '(^|/)(tests?|__tests__|e2e|fixtures)/|\.(test|spec)\.[A-Za-z0-9]+$' \
            || true)
          # Date-prefixed entries only (not the dir's README). The legacy single-file path lives ONLY in the
          # regex — naming it in prose breaks the migration ledger's grep of this file.
          spec=$(printf '%s\n' "$changed" \
            | grep -E '^spec/features/.+/(contract|intent)\.md$|^spec/history/[0-9][^/]*\.md$|^spec/HISTORY\.md$' \
            || true)
          if [ -n "$behavior" ] && [ -z "$spec" ]; then
            {
              echo "## Spec drift (advisory)"
              echo
              echo "Behavior changed but no \`spec/features/<id>/contract.md\`, \`intent.md\`,"
              echo "or a \`spec/history/\` entry was written in this change. Update the spec in the"
              echo "same change, or confirm via the PR template's **Spec sync** checkbox that"
              echo "there is no behavior change."
              echo
              echo "Behavior paths flagged:"
              printf '%s\n' "$behavior" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$behavior" | while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "::warning file=${f}::Behavior changed without a spec/contract/history update (spec-drift, advisory)"
            done
          fi

  # Advisory; .aislop/config.yml turns down rules that duplicate ruff/Biome. Promote with `aislop ci` once trusted.
  ai-slop:
    name: ai-slop (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Scan for AI slop (SARIF)
        run: npx --yes aislop@0.14.0 scan . --sarif > aislop.sarif

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: aislop.sarif
          category: ai-slop
