# Zensical configuration for the e22-plugins documentation site.
#
# Zensical (the Material for MkDocs team's successor) reads this mkdocs.yml
# natively; the filename is kept so scripts/validate_docs.py and the nav below
# keep working unchanged.
#
# Served locally with `mise run docs:serve` and built (strict) with
# `mise run docs:build`. The toolchain lives in the `docs` dependency-group
# (see pyproject.toml). The nav below is the source of truth for site
# structure; scripts/validate_docs.py asserts every nav entry resolves to a
# real file and every docs/*.md is reachable from it.
#
# Zensical builds every file under docs_dir (it has no `exclude_docs` setting),
# so non-page content is kept OUT of docs/: page scaffolds live in the repo-root
# `docs-templates/` and the authoring guide is the repo-root `AUTHORING.md`.
site_name: e22-plugins — steer
site_description: Engineering-standards plugin marketplace — the steer plugin.
# Served from the branded root domain (Route 53 CNAME → GitHub Pages, public);
# sets the canonical/asset base for root-path serving.
site_url: https://ai.element-22.com/
docs_dir: docs
# `mise run docs:build` writes the build here (gitignored). Published to GitHub
# Pages from this output by .github/workflows/docs-deploy.yml.
site_dir: site
use_directory_urls: true

# Header repo link + the per-page "Edit"/"View source" actions
# (theme features content.action.edit / content.action.view below).
# `edit_uri` MUST be set explicitly: Zensical's inferred default for a
# github.com `repo_url` is `edit/master/<docs_dir>`, and this repo's default
# branch is `main` — leaving it inferred points every pencil at a dead branch.
repo_url: https://github.com/element22llc/e22-plugins
repo_name: element22llc/e22-plugins
edit_uri: edit/main/docs
# Rendered in the footer meta bar, left of Zensical's own attribution.
copyright: Copyright &copy; 2026 Element 22 LLC — Apache-2.0

theme:
  # `classic` matches the Material for MkDocs look & feel (vs Zensical's `modern`).
  variant: classic
  icon:
    # Beats the default generic book/person glyph and matches the plugin name.
    logo: material/steering
  features:
    # --- navigation ---------------------------------------------------------
    # Top-level nav entries become header tabs; the sidebar then shows only the
    # active section, which keeps a 30-page site from rendering as one long list.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    # A section whose first child is that section's own index page renders as a
    # clickable section header instead of a redundant "Overview" leaf. Requires
    # the nav shape used by `Workflows` below.
    - navigation.indexes
    - navigation.top
    - navigation.instant
    # Thin progress bar during instant navigation — without it a slow page load
    # looks like a dead click.
    - navigation.instant.progress
    # Keep the URL's anchor in sync with the scrolled heading, so copying the
    # address bar deep-links to the section actually on screen.
    - navigation.tracking
    # Previous/next links in the footer. These docs read linearly within a
    # section (installation → first workflow → onboarding) and had no way to
    # page through.
    - navigation.footer
    # --- content ------------------------------------------------------------
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    # --- search -------------------------------------------------------------
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  # Lets block-level Markdown render inside HTML wrappers — required for the
  # `<div class="grid cards" markdown>` card grid on the home page.
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  # Without this, the `- [ ]` items on team-rollout/launch-checklist.md render
  # as the literal text "[ ]" instead of checkboxes.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # mermaid.js diagrams: Material renders fenced ```mermaid blocks client-side
  # via this custom superfence. No extra plugin/dependency required.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Windows setup: getting-started/windows-setup.md
      - First workflow: getting-started/first-workflow.md
      - Team onboarding: getting-started/team-onboarding.md
      # External link: the Slidev decks are published into this same site at
      # /presentation/<slug>/ by .github/workflows/docs-deploy.yml. Absolute URLs
      # keep the strict build and validate_docs from treating them as missing
      # pages. Filed under the section whose topic they cover rather than as
      # top-level entries — with navigation.tabs on, a top-level entry costs a
      # header tab, and 10 tabs overflow the 61rem grid.
      - Onboarding deck: https://ai.element-22.com/presentation/onboarding/
  - Concepts:
      - SDLC overview: concepts/sdlc.md
      - Product spine: concepts/product-spine.md
      - Lifecycle: concepts/lifecycle.md
      - Authorization model: concepts/authorization-model.md
      - Deployment & environments: concepts/deployment.md
      - GitHub Copilot support: concepts/copilot-support.md
      # External link — see the note on the onboarding deck above.
      - SDLC deck: https://ai.element-22.com/presentation/sdlc/
  - Workflows:
      # Bare path (no title) + the navigation.indexes feature: this page becomes
      # the `Workflows` section landing page rather than an "Overview" child.
      - workflows/index.md
      - Adopt: workflows/adopt.md
      - Spec: workflows/spec.md
      - Intake: workflows/intake.md
      - Issues: workflows/issues.md
      - Work: workflows/work.md
      - Build: workflows/build.md
  - Reference:
      - Skills: reference/skills.md
      - Subagents: reference/agents.md
      - Hooks: reference/hooks.md
      - Configuration: reference/configuration.md
      - GitHub Actions integration: reference/github-integration.md
      - MCP servers: reference/mcp-servers.md
      - Repository contract: reference/repository-contract.md
  - Team rollout:
      - Known limitations: reference/known-limitations.md
      - Launch checklist: team-rollout/launch-checklist.md
  - Decisions: decisions/index.md
  - Contributing:
      - Documentation: contributing/documentation.md
      - Release process: contributing/release-process.md
