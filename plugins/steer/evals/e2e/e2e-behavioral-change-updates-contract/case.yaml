# E2E case - see ../README.md.
schema_version: "1.1"
name: e2e-behavioral-change-updates-contract
tags: [e2e]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    Make total() reject a line item whose quantity is zero or negative by raising ValueError.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Skill
    - Bash
    - Write
    - Edit
    - mcp__github__issue_read
    - mcp__github__list_issues
    - mcp__github__search_issues
    - mcp__github__issue_write
    - mcp__github__add_issue_comment
    - mcp__github__create_pull_request
    - mcp__github__update_pull_request
    - mcp__github__pull_request_read
    - mcp__github__merge_pull_request
  append_system_prompt: |
    This session is a sandboxed evaluation. `origin` is a local remote, so
    `git push` works. GitHub issues and pull requests for acme/checkout are
    reachable only through the mcp__github__* tools this session lists; the `gh`
    CLI and general network access are unavailable, and there is no package
    install (Python's standard library is all there is). Treat this as the shape
    of the environment, not as a fault to diagnose, and work as you would in a
    real session.

runs: 1
